<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F4C81;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C9A7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.98" />
    </linearGradient>

    <linearGradient id="mvpGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="productionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="awsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="100" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="1800" cy="950" r="120" fill="#FFFFFF" opacity="0.1"/>

  <!-- Header -->
  <text x="960" y="90" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    PROTOTYPE DEVELOPMENT COST
  </text>
  <text x="960" y="145" font-family="Arial, sans-serif" font-size="28" fill="#E0F2FE" text-anchor="middle">
    DiabetCare AI - MVP Implementation Budget (13 Days)
  </text>

  <!-- Main Card -->
  <rect x="80" y="190" width="1760" height="820" rx="24" fill="url(#cardGradient)" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.2))"/>

  <!-- Two Column Layout -->

  <!-- LEFT SIDE: MVP Cost Breakdown -->
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#0F172A">
    MVP Cost Breakdown (13 Days)
  </text>

  <!-- Team Costs -->
  <rect x="120" y="280" width="800" height="100" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="140" y="315" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1E40AF">
    👥 Team Costs (13 days)
  </text>
  <text x="140" y="345" font-family="Arial, sans-serif" font-size="18" fill="#3B82F6">
    Volunteer Team: Hackathon participants
  </text>
  <text x="140" y="370" font-family="Arial, sans-serif" font-size="18" fill="#3B82F6">
    4-5 developers + 1 clinical advisor
  </text>
  <text x="750" y="365" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1E3A8A" text-anchor="end">
    ₹0
  </text>

  <!-- AWS Infrastructure -->
  <rect x="120" y="400" width="800" height="100" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="140" y="435" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400E">
    ☁️ AWS Infrastructure (13 days)
  </text>
  <text x="140" y="465" font-family="Arial, sans-serif" font-size="18" fill="#D97706">
    Bedrock + Rekognition + Amplify + DynamoDB + S3 + RDS
  </text>
  <text x="140" y="490" font-family="Arial, sans-serif" font-size="16" fill="#B45309">
    (AWS Activate credits may offset some/all costs)
  </text>
  <text x="750" y="475" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#78350F" text-anchor="end">
    ₹50K
  </text>

  <!-- Tools & Datasets -->
  <rect x="120" y="520" width="800" height="100" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="140" y="555" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#065F46">
    🗂️ Tools & Datasets
  </text>
  <text x="140" y="585" font-family="Arial, sans-serif" font-size="18" fill="#059669">
    Indian food DB (₹20K) + Testing devices (₹15K)
  </text>
  <text x="750" y="595" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#047857" text-anchor="end">
    ₹35K
  </text>

  <!-- Miscellaneous -->
  <rect x="120" y="640" width="800" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="140" y="675" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3730A3">
    🔧 Miscellaneous
  </text>
  <text x="140" y="700" font-family="Arial, sans-serif" font-size="18" fill="#6366F1">
    Domain name, SSL, project tools
  </text>
  <text x="750" y="705" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#4338CA" text-anchor="end">
    ₹2K
  </text>

  <!-- Total MVP Cost -->
  <rect x="120" y="750" width="800" height="90" rx="16" fill="url(#mvpGradient)"/>
  <text x="520" y="790" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    TOTAL MVP COST (13 Days)
  </text>
  <text x="520" y="830" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    ₹87,000
  </text>

  <!-- RIGHT SIDE: Comparison & Funding -->
  <text x="1000" y="250" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#0F172A">
    Cost Comparison
  </text>

  <!-- MVP vs Production Table -->
  <rect x="1000" y="280" width="800" height="280" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>

  <!-- Table Headers -->
  <rect x="1000" y="280" width="800" height="50" rx="12" fill="#334155"/>
  <text x="1020" y="313" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">
    Phase
  </text>
  <text x="1350" y="313" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">
    Duration
  </text>
  <text x="1630" y="313" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="end">
    Cost
  </text>

  <!-- MVP Row -->
  <rect x="1000" y="330" width="800" height="60" fill="#D1FAE5"/>
  <text x="1020" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#065F46">
    MVP (Hackathon)
  </text>
  <text x="1350" y="365" font-family="Arial, sans-serif" font-size="20" fill="#059669">
    13 days
  </text>
  <text x="1770" y="365" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#047857" text-anchor="end">
    ₹87,000
  </text>

  <!-- Production Row -->
  <rect x="1000" y="390" width="800" height="60" fill="#DBEAFE"/>
  <text x="1020" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#1E40AF">
    Production Launch
  </text>
  <text x="1350" y="425" font-family="Arial, sans-serif" font-size="20" fill="#3B82F6">
    6 months
  </text>
  <text x="1770" y="425" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1E3A8A" text-anchor="end">
    ₹1.02 Cr
  </text>

  <!-- Savings Row -->
  <rect x="1000" y="450" width="800" height="60" fill="#FEF3C7"/>
  <text x="1020" y="485" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#92400E">
    Cost Efficiency
  </text>
  <text x="1350" y="485" font-family="Arial, sans-serif" font-size="20" fill="#D97706">
    MVP first
  </text>
  <text x="1770" y="485" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#78350F" text-anchor="end">
    117x cheaper
  </text>

  <!-- Users Row -->
  <rect x="1000" y="510" width="800" height="50" fill="#E0E7FF"/>
  <text x="1020" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#3730A3">
    Users → Features
  </text>
  <text x="1350" y="540" font-family="Arial, sans-serif" font-size="17" fill="#6366F1">
    50 testers → 500K users
  </text>
  <text x="1770" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4338CA" text-anchor="end">
    Core → Full platform
  </text>

  <!-- Funding Sources -->
  <text x="1000" y="610" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F172A">
    Funding Sources (MVP)
  </text>

  <rect x="1000" y="640" width="800" height="240" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <text x="1020" y="680" font-family="Arial, sans-serif" font-size="20" fill="#334155">
    ✅ Personal Investment: ₹87,000 (bootstrapped)
  </text>
  <text x="1020" y="715" font-family="Arial, sans-serif" font-size="20" fill="#334155">
    ✅ AWS Activate Credits: May offset AWS costs (apply post-selection)
  </text>
  <text x="1020" y="750" font-family="Arial, sans-serif" font-size="20" fill="#334155">
    ✅ Hackathon Prize (if won): ₹5-10 lakh (for production transition)
  </text>
  <text x="1020" y="785" font-family="Arial, sans-serif" font-size="20" fill="#334155">
    ✅ Volunteer Team: ₹0 upfront (hackathon participants)
  </text>
  <text x="1020" y="820" font-family="Arial, sans-serif" font-size="20" fill="#334155">
    ✅ Open Source Datasets: ₹0 (Kaggle DR dataset - 35,126 images)
  </text>
  <text x="1020" y="855" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#10B981">
    💰 MVP Budget: ₹87,000 (lean, focused, achievable)
  </text>

  <!-- Key Highlights -->
  <rect x="120" y="910" width="1680" height="70" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="945" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1E40AF">
    💡 Key Highlights:
  </text>
  <text x="360" y="945" font-family="Arial, sans-serif" font-size="19" fill="#3B82F6">
    13-day rapid sprint  |  Volunteer team = ₹0 labor cost  |  Validate before scale  |  117x cheaper than production  |  Lean & focused
  </text>
  <text x="140" y="970" font-family="Arial, sans-serif" font-size="18" fill="#64748B">
    Post-MVP: Validate concept → Raise ₹2.5 Cr seed funding (shown in funding slide) → Scale to 500K users in 12-18 months
  </text>

  <!-- Footer -->
  <rect x="80" y="1020" width="1760" height="40" rx="0" fill="#0F172A" opacity="0.05"/>
  <text x="960" y="1047" font-family="Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">
    MVP Budget: Hackathon Phase (13 days) | Production Budget: Post-funding (6-12 months) | AWS AI for Bharat Hackathon 2026
  </text>
</svg>
