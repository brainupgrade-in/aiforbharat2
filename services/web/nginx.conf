server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: any unknown route serves index.html so React Router can handle it
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets — cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # PWA / SW entry — never cache
  location = /sw.js                 { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /registerSW.js         { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest  { add_header Cache-Control "no-cache" always; try_files $uri =404; }

  # index.html — never cache (we want PWA refresh checks to see new builds)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
