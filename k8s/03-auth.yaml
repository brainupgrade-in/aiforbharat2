apiVersion: apps/v1
kind: Deployment
metadata:
  name: nazar-auth
  namespace: nazarai
  labels:
    app: nazar-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nazar-auth
  template:
    metadata:
      labels:
        app: nazar-auth
    spec:
      containers:
        - name: auth
          image: registry.gheware-ai.com/nazarai/auth:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: nazar-auth-env
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nazar-auth
  namespace: nazarai
spec:
  selector:
    app: nazar-auth
  ports:
    - name: http
      port: 80
      targetPort: 8080
