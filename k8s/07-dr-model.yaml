apiVersion: apps/v1
kind: Deployment
metadata:
  name: nazar-dr-model
  namespace: nazarai
  labels:
    app: nazar-dr-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nazar-dr-model
  template:
    metadata:
      labels:
        app: nazar-dr-model
    spec:
      containers:
        - name: model
          image: registry.gheware-ai.com/nazarai/dr-model:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TORCH_NUM_THREADS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nazar-dr-model
  namespace: nazarai
spec:
  selector:
    app: nazar-dr-model
  ports:
    - name: http
      port: 80
      targetPort: 8080
