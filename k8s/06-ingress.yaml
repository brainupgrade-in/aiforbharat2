apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hasura-rewrite
  namespace: nazarai
spec:
  replacePathRegex:
    regex: "^/api/graphql"
    replacement: "/v1/graphql"
---
# /api/graphql gets rewritten to /v1/graphql via Traefik middleware annotation.
# Kept in a separate Ingress so the middleware applies only to this path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nazarai-graphql
  namespace: nazarai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: nazarai-hasura-rewrite@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nazarai.gheware-ai.com
      secretName: nazarai-tls
  rules:
    - host: nazarai.gheware-ai.com
      http:
        paths:
          - path: /api/graphql
            pathType: Prefix
            backend:
              service:
                name: hasura
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nazarai
  namespace: nazarai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nazarai.gheware-ai.com
      secretName: nazarai-tls
  rules:
    - host: nazarai.gheware-ai.com
      http:
        paths:
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: nazar-chatbot
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: nazar-auth
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nazar-web
                port:
                  number: 80
