<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Title -->
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">DiabetCare AI - Estimated Monthly Cost</text>
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6b7280">AWS Cloud Infrastructure (10,000 Active Users/Month)</text>

  <!-- Cost Breakdown Container -->
  <rect x="50" y="90" width="1100" height="650" fill="#f9fafb" stroke="#1f2937" stroke-width="2" rx="8"/>

  <!-- Column Headers -->
  <rect x="70" y="110" width="1060" height="40" fill="#1e40af" rx="4"/>
  <text x="180" y="137" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Service Category</text>
  <text x="520" y="137" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Usage Details</text>
  <text x="900" y="137" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Est. Cost/Month</text>

  <!-- Row 1: Compute & Lambda -->
  <rect x="70" y="160" width="1060" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="90" y="183" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">AWS Lambda (Compute)</text>
  <text x="90" y="202" font-family="Arial, sans-serif" font-size="10" fill="#666">5 functions (Auth, Glucose API,</text>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="10" fill="#666">DR Processor, Chatbot, Meal)</text>
  <text x="380" y="190" font-family="Arial, sans-serif" font-size="11" fill="#333">• 2M requests/month (avg 200 req/user)</text>
  <text x="380" y="205" font-family="Arial, sans-serif" font-size="11" fill="#333">• Avg duration: 3s, Avg memory: 1GB</text>
  <text x="850" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹7,100</text>

  <!-- Row 2: AI/ML Services -->
  <rect x="70" y="220" width="1060" height="80" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="90" y="243" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">AI/ML Services</text>
  <text x="90" y="262" font-family="Arial, sans-serif" font-size="10" fill="#666">Bedrock (Claude + Nova),</text>
  <text x="90" y="275" font-family="Arial, sans-serif" font-size="10" fill="#666">Rekognition, SageMaker,</text>
  <text x="90" y="288" font-family="Arial, sans-serif" font-size="10" fill="#666">Translate</text>
  <text x="380" y="245" font-family="Arial, sans-serif" font-size="11" fill="#333">• Bedrock Claude: 50M tokens (₹1,660 in, ₹6,225 out)</text>
  <text x="380" y="260" font-family="Arial, sans-serif" font-size="11" fill="#333">• Bedrock Nova: 10K images (₹2,490)</text>
  <text x="380" y="275" font-family="Arial, sans-serif" font-size="11" fill="#333">• Rekognition: 500 DR scans/month (₹4,150)</text>
  <text x="380" y="290" font-family="Arial, sans-serif" font-size="11" fill="#333">• Translate: 2M chars (₹3,320), SageMaker: ₹2,075</text>
  <text x="850" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹20,000</text>

  <!-- Row 3: Data Storage -->
  <rect x="70" y="300" width="1060" height="70" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="90" y="323" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Data Storage & Database</text>
  <text x="90" y="342" font-family="Arial, sans-serif" font-size="10" fill="#666">DynamoDB, S3, RDS,</text>
  <text x="90" y="355" font-family="Arial, sans-serif" font-size="10" fill="#666">ElastiCache</text>
  <text x="380" y="325" font-family="Arial, sans-serif" font-size="11" fill="#333">• DynamoDB: 10GB storage, 5M reads, 2M writes (₹2,905)</text>
  <text x="380" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">• S3: 100GB images/reports (₹249), 50K requests (₹166)</text>
  <text x="380" y="355" font-family="Arial, sans-serif" font-size="11" fill="#333">• RDS PostgreSQL: db.t4g.medium Multi-AZ (₹6,640)</text>
  <text x="380" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">• ElastiCache: cache.t4g.small x2 nodes (₹4,150)</text>
  <text x="850" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹14,100</text>

  <!-- Row 4: API Gateway & Hosting -->
  <rect x="70" y="370" width="1060" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="90" y="393" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">API Gateway & Hosting</text>
  <text x="90" y="412" font-family="Arial, sans-serif" font-size="10" fill="#666">AppSync, API Gateway,</text>
  <text x="90" y="425" font-family="Arial, sans-serif" font-size="10" fill="#666">Amplify Hosting</text>
  <text x="380" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">• AppSync: 2M GraphQL queries (₹1,328)</text>
  <text x="380" y="410" font-family="Arial, sans-serif" font-size="11" fill="#333">• API Gateway: 2M REST requests (₹581)</text>
  <text x="380" y="425" font-family="Arial, sans-serif" font-size="11" fill="#333">• Amplify Hosting: 50GB build/deploy (₹1,245)</text>
  <text x="850" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹3,200</text>

  <!-- Row 5: Content Delivery -->
  <rect x="70" y="430" width="1060" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="90" y="453" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">CDN & Content Delivery</text>
  <text x="90" y="472" font-family="Arial, sans-serif" font-size="10" fill="#666">CloudFront, Route 53</text>
  <text x="380" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">• CloudFront: 100GB data transfer (India) (₹664)</text>
  <text x="380" y="470" font-family="Arial, sans-serif" font-size="11" fill="#333">• Route 53: 1 hosted zone + 5M queries (₹166)</text>
  <text x="850" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹830</text>

  <!-- Row 6: Security & Monitoring -->
  <rect x="70" y="480" width="1060" height="60" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="90" y="503" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3730a3">Security & Monitoring</text>
  <text x="90" y="522" font-family="Arial, sans-serif" font-size="10" fill="#666">Cognito, WAF, CloudWatch,</text>
  <text x="90" y="535" font-family="Arial, sans-serif" font-size="10" fill="#666">SNS, IAM</text>
  <text x="380" y="505" font-family="Arial, sans-serif" font-size="11" fill="#333">• Cognito: 10K MAU (free tier), advanced security (₹415)</text>
  <text x="380" y="520" font-family="Arial, sans-serif" font-size="11" fill="#333">• CloudWatch: 5GB logs, metrics, alarms (₹4,150)</text>
  <text x="380" y="535" font-family="Arial, sans-serif" font-size="11" fill="#333">• SNS: 100K SMS + 1M push notifications (₹2,075)</text>
  <text x="850" y="515" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹6,600</text>

  <!-- Row 7: Data Transfer -->
  <rect x="70" y="540" width="1060" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="90" y="563" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Data Transfer & Networking</text>
  <text x="90" y="582" font-family="Arial, sans-serif" font-size="10" fill="#666">VPC, NAT Gateway (optional)</text>
  <text x="380" y="565" font-family="Arial, sans-serif" font-size="11" fill="#333">• Inter-AZ data transfer: 20GB (₹166)</text>
  <text x="380" y="580" font-family="Arial, sans-serif" font-size="11" fill="#333">• Outbound data: 50GB to internet (₹415)</text>
  <text x="850" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹580</text>

  <!-- Row 8: External Integrations -->
  <rect x="70" y="590" width="1060" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="90" y="613" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">External Integrations</text>
  <text x="90" y="632" font-family="Arial, sans-serif" font-size="10" fill="#666">ABDM, Payment Gateway</text>
  <text x="380" y="615" font-family="Arial, sans-serif" font-size="11" fill="#333">• ABDM API: Free (government service)</text>
  <text x="380" y="630" font-family="Arial, sans-serif" font-size="11" fill="#333">• Razorpay/Stripe: 2% transaction fees (separate)</text>
  <text x="850" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#059669">₹0</text>

  <!-- Total Row -->
  <rect x="70" y="650" width="1060" height="50" fill="#065f46" rx="4"/>
  <text x="90" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">TOTAL ESTIMATED COST</text>
  <text x="380" y="680" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5">(10,000 Active Users/Month)</text>
  <text x="1050" y="683" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="end" fill="#fef3c7">₹52,410/mo</text>

  <!-- Cost Per User -->
  <rect x="70" y="710" width="350" height="20" fill="#d1fae5" stroke="#059669" stroke-width="1" rx="3"/>
  <text x="245" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Cost Per User: ₹5.24/month</text>

  <!-- Annual Projection -->
  <rect x="440" y="710" width="340" height="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="610" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b21b6">Annual Projection: ₹6,28,920/year</text>

  <!-- Scalability Note -->
  <rect x="800" y="710" width="330" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="965" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">@ 100K users: ~₹3,73,500/month</text>

  <!-- Footer Notes -->
  <text x="600" y="765" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">Cost Optimization Strategies:</text>
  <text x="200" y="785" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">• AWS Free Tier: Cognito (50K MAU free), Lambda (1M requests free), S3 (5GB free) - saves ~₹1,660/mo</text>
  <text x="750" y="785" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">• Reserved Instances: RDS/ElastiCache (30% savings) - saves ~₹3,320/mo</text>
  <text x="250" y="800" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">• Bedrock pay-per-token: Only pay for actual AI usage (vs SageMaker hosting ~₹16,600/mo)</text>
  <text x="750" y="800" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">• S3 Lifecycle: Move old images to Glacier after 1 year - saves ~₹415/mo</text>
</svg>
